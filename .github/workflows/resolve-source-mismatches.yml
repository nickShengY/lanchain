name: Resolve security skill source mismatches

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve every mismatched source
        id: resolve
        continue-on-error: true
        run: python resolve_mismatches_plain.py
      - name: Upload resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-skill-source-mismatch-resolution
          path: mismatch_resolution_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Propagate resolver failure
        if: steps.resolve.outcome == 'failure'
        run: exit 1
