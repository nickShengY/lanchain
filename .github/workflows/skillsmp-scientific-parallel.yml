name: SkillsMP scientific security rebuild parallel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Decode and run corrected collector
        run: |
          base64 -d skillsmp_collect_corrected.py.gz.b64 | gzip -d > skillsmp_collect_corrected.py
          python -m py_compile skillsmp_collect_corrected.py
          python skillsmp_collect_corrected.py
      - uses: actions/upload-artifact@v4
        with:
          name: skillsmp-collection
          path: skillsmp_scientific_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  review:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - uses: actions/download-artifact@v4
        with:
          name: skillsmp-collection
          path: skillsmp_scientific_output
      - name: Patch reviewer to process one deterministic shard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('skillsmp_review.py')
          s=p.read_text(encoding='utf-8')
          old='rows=read_csv(OUT/"ranked_frame_union.csv"); reviews=[]; source_text_by_key={}'
          new='all_rows=read_csv(OUT/"ranked_frame_union.csv"); rows=[r for i,r in enumerate(all_rows) if i%int(os.environ["SHARD_TOTAL"])==int(os.environ["SHARD_INDEX"])]; reviews=[]; source_text_by_key={}'
          if old not in s:
              raise SystemExit('reviewer patch anchor not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python -m py_compile skillsmp_review.py
      - name: Source-review shard ${{ matrix.shard }}
        run: python skillsmp_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: review-shard-${{ matrix.shard }}
          path: skillsmp_scientific_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [collect, review]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: skillsmp-collection
          path: collection
      - uses: actions/download-artifact@v4
        with:
          pattern: review-shard-*
          path: shards
      - name: Merge all source reviews and enforce completion gate
        run: python skillsmp_merge_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: skillsmp-scientific-security-parallel-final
          path: skillsmp_scientific_final
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
