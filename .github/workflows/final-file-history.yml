name: Resolve final security skill file dates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve file histories
        run: python resolve_file_history.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: final-security-skill-file-history
          path: file_history_output
          retention-days: 7
