name: Security skill marketplace audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Decode collector
        run: base64 -d audit_collector.py.gz.b64 | gzip -d > audit_collector.py
      - name: Run exhaustive high-recall census and source review
        id: audit
        continue-on-error: true
        run: python audit_collector.py
      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-skill-marketplace-audit-output
          path: audit_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Propagate collector failure after artifact upload
        if: steps.audit.outcome == 'failure'
        run: exit 1
