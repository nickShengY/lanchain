name: Security skill marketplace audit — all category listings

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Decode collector
        run: base64 -d audit_collector.py.gz.b64 | gzip -d > audit_collector.py
      - name: Force source review of every enumerated listing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('audit_collector.py')
          s=p.read_text()
          old=" for x in ret:\n  k=(norm(x.get('repo_label')) or norm(x.get('marketplace_url')),snorm(x.get('skill_slug')or x.get('skill_name')));groups[k].append(x)"
          new=" for x in allrows:\n  k=(norm(x.get('repo_label')) or norm(x.get('marketplace_url')),snorm(x.get('skill_slug')or x.get('skill_name')));groups[k].append(x)"
          if old not in s:
              raise SystemExit('expected source-review loop not found')
          s=s.replace(old,new,1)
          s=s.replace("'complete':sum(s==200 for s in stats)==len(QUERIES),'limit':'High-recall keyword API census, not a bulk category export'", "'complete':False,'limit':'High-recall 50-query keyword API census under documented anonymous quota; not a bulk category export'", 1)
          p.write_text(s)
          PY
          python -m py_compile audit_collector.py
      - name: Run exhaustive census and source review
        id: audit
        continue-on-error: true
        run: python audit_collector.py
      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-skill-marketplace-audit-all-output
          path: audit_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Propagate collector failure after artifact upload
        if: steps.audit.outcome == 'failure'
        run: exit 1
