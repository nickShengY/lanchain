name: SkillsMP scientific security rebuild

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Decode collector
        run: base64 -d skillsmp_scientific_collector.py.gz.b64 | gzip -d > skillsmp_scientific_collector.py
      - name: Collect both ranked category frames and review every source
        id: collect
        continue-on-error: true
        run: python skillsmp_scientific_collector.py
      - name: Upload scientific SkillsMP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillsmp-scientific-security-rebuild
          path: skillsmp_scientific_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Propagate collector failure after evidence upload
        if: steps.collect.outcome == 'failure'
        run: exit 1
